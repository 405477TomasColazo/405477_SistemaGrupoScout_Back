##### Production Application Properties #####
app.name='@project.name@'
app.desc='@project.description@'
app.version='@project.version@'
app.url=${APP_URL:https://your-app.railway.app}
server.port=${PORT:8080}
app.dev-name=Tomas Colazo
app.dev-email=405477@tecnicatura.frc.utn.edu.ar
app.frontend.url=${FRONTEND_URL:https://your-app.vercel.app}

# Configuración de Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

## Spring Data Source ##
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jose_hernandez_db2}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Debug logging para ver qué variables se están leyendo
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.boot.autoconfigure.jdbc=DEBUG

## Spring JPA ##
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

# Disable debug logging in production
logging.level.org.springframework.security=WARN
logging.level.root=INFO

## MAIL ##
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

